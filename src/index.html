<!DOCTYPE html>
<html lang="ES">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <body>
        <header>
            <h1>Bienvenidos!</h1>
        </header>
        <div class="container text-center">
            <div class="row justify-content-center">
                <div class="col-sm-3 shadow-sm p-3 bg-body rounded">
                    <input class="form-control text-center" id="placa" type="text" placeholder="Ingrese patente"></input>
                    <label for="placa" class="text-secondary fst-italic text-center" style="font-size: 14px;" ><small> Ejemplo AAAA99 o AAAA-99</small></label>
                </div>
                <div class="col-sm-2 shadow-sm p-3 bg-body rounded">
                    <button type="button" onclick="Mostrar_datos()" class="btn btn-primary" title="buscar"><i class="bi bi-search"></i>&nbspBuscar</button>
                </div>
                <div class="spinner-border justify-content-center" id="spin1" style="display:none;" role="status">
                    <span class="sr-only"></span>
                </div> 
            <div>
                  <div id="txtHint" class="shadow p-3 mb-5 bg-white rounded">Porfavor ingresa la patente de tu vehículo.</div>                 
            </div>
            </div><!-- Cierre Div busqueda-->
        </div>
        <footer></footer>

        <script src="estilos/paginacion.js"></script>
